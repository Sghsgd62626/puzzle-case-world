<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle Case World</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:white;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#354a91 0,#141b3b 45%,#070914 100%);
}

header{
    text-align:center;
    padding:25px 15px 15px;
}

h1{
    margin:0;
    font-size:38px;
}

.subtitle{
    opacity:.7;
    margin-top:8px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:20px 0;
}

.stat{
    background:#ffffff12;
    border:1px solid #ffffff20;
    border-radius:14px;
    padding:10px 16px;
}

nav{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    padding:10px;
}

nav button{
    border:0;
    border-radius:12px;
    padding:11px 15px;
    background:#ffffff15;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

nav button.active{
    background:#6c63ff;
}

main{
    max-width:1050px;
    margin:auto;
    padding:15px;
}

.tab{
    display:none;
}

.tab.active{
    display:block;
}

.panel{
    background:#ffffff0b;
    border:1px solid #ffffff18;
    border-radius:22px;
    padding:22px;
    box-shadow:0 15px 50px #0005;
}

.cases,
.collection,
.quests{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:16px;
}

.case,
.piece,
.character,
.quest{
    background:#ffffff0b;
    border:1px solid #ffffff18;
    border-radius:18px;
    padding:18px;
    text-align:center;
}

.case-icon{
    font-size:65px;
}

.case button,
.quest button,
.promo button{
    border:0;
    border-radius:11px;
    padding:12px 18px;
    color:white;
    background:linear-gradient(135deg,#6c63ff,#9c5cff);
    font-weight:bold;
    cursor:pointer;
}

.case button{
    width:100%;
}

.piece .emoji{
    font-size:50px;
}

.count{
    font-size:24px;
    font-weight:bold;
    margin:7px;
}

.parts{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin:12px 0;
}

.part{
    min-height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0005;
    border-radius:10px;
    font-size:27px;
}

.part.have{
    background:#6c63ff55;
}

.quest-progress{
    height:9px;
    background:#0006;
    border-radius:10px;
    overflow:hidden;
    margin:12px 0;
}

.quest-progress span{
    display:block;
    height:100%;
    background:#6c63ff;
}
